name: sentinellan
services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinellan}
      POSTGRES_USER: ${POSTGRES_USER:-sentinellan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["sentinellan-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SentinelLAN: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sentinellan};Username=${POSTGRES_USER:-sentinellan};Password=${POSTGRES_PASSWORD:-change-me-for-local-development}
      SENTINELLAN_DEMO_ADMIN_EMAIL: ${SENTINELLAN_DEMO_ADMIN_EMAIL:-admin@sentinellan.local}
      SENTINELLAN_DEMO_ADMIN_PASSWORD: ${SENTINELLAN_DEMO_ADMIN_PASSWORD:-local-demo-only}
      SENTINELLAN_ENROLLMENT_TOKEN: ${SENTINELLAN_ENROLLMENT_TOKEN:-local-enroll-only}
      SENTINELLAN_SIGNING_KEY: ${SENTINELLAN_SIGNING_KEY:?Set a unique SENTINELLAN_SIGNING_KEY in .env}
      SENTINELLAN_ACCESS_TOKEN_SIGNING_KEY: ${SENTINELLAN_ACCESS_TOKEN_SIGNING_KEY:?Set a unique SENTINELLAN_ACCESS_TOKEN_SIGNING_KEY in .env}
      SENTINELLAN_SERVER_VAULT_KEY: ${SENTINELLAN_SERVER_VAULT_KEY:?Set a unique SENTINELLAN_SERVER_VAULT_KEY in .env}
      SENTINELLAN_PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:-}
      SENTINELLAN_PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:-}
      SENTINELLAN_WEB_ORIGINS: ${SENTINELLAN_WEB_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      SENTINELLAN_AGENT_PUBLIC_URL: ${SENTINELLAN_AGENT_PUBLIC_URL:-http://localhost:8080}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  company:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        WEB_APP: company
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_COMPANY_URL: http://localhost:3000/company
        NEXT_PUBLIC_EMPLOYEE_URL: http://localhost:3001/employee
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  employee:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        WEB_APP: employee
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_COMPANY_URL: http://localhost:3000/company
        NEXT_PUBLIC_EMPLOYEE_URL: http://localhost:3001/employee
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [api]
  platform:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        WEB_APP: platform
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_COMPANY_URL: http://localhost:3000/company
        NEXT_PUBLIC_EMPLOYEE_URL: http://localhost:3001/employee
    ports: ["127.0.0.1:3002:3000"]
    depends_on: [api]
volumes:
  sentinellan-postgres:
