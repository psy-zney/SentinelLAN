name: sentinellan-lan

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinellan}
      POSTGRES_USER: ${POSTGRES_USER:-sentinellan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/lan/.env}
    volumes:
      - sentinellan-lan-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SentinelLAN: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sentinellan};Username=${POSTGRES_USER:-sentinellan};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SENTINELLAN_BOOTSTRAP_ORG_CODE: ${BOOTSTRAP_ORG_CODE:?Set BOOTSTRAP_ORG_CODE}
      SENTINELLAN_LOGIN_ORG_CODE: ${SENTINELLAN_LOGIN_ORG_CODE:-${BOOTSTRAP_ORG_CODE}}
      SENTINELLAN_BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:?Set BOOTSTRAP_ORG_NAME}
      SENTINELLAN_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      SENTINELLAN_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      SENTINELLAN_COMMAND_PRIVATE_KEY_PEM: ${COMMAND_PRIVATE_KEY_PEM:?Set COMMAND_PRIVATE_KEY_PEM}
      SENTINELLAN_COMMAND_KEY_ID: ${COMMAND_KEY_ID:?Set COMMAND_KEY_ID}
      SENTINELLAN_ACCESS_TOKEN_SIGNING_KEY: ${ACCESS_TOKEN_SIGNING_KEY:?Set ACCESS_TOKEN_SIGNING_KEY}
      SENTINELLAN_SERVER_VAULT_KEY: ${SERVER_VAULT_KEY:?Set SERVER_VAULT_KEY}
      SENTINELLAN_DATA_ENCRYPTION_KEY: ${SENTINELLAN_DATA_ENCRYPTION_KEY:?Set a Base64 32-byte data encryption key}
      SENTINELLAN_DEPLOYMENT_MODE: SelfHost
      SENTINELLAN_WEB_ORIGINS: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      SENTINELLAN_KNOWN_PROXIES: ${SENTINELLAN_KNOWN_PROXIES:-${SENTINELLAN_PROXY_IP:-172.30.20.10}}
      SENTINELLAN_KNOWN_NETWORKS: ${SENTINELLAN_KNOWN_NETWORKS:-}
      SENTINELLAN_AGENT_PUBLIC_URL: ${SENTINELLAN_AGENT_PUBLIC_URL:-https://${PUBLIC_DOMAIN}}
      SENTINELLAN_AGENT_REQUIRE_SIGNED_REQUESTS: ${SENTINELLAN_AGENT_REQUIRE_SIGNED_REQUESTS:-}
      SENTINELLAN_AGENT_LEGACY_AUTH_UNTIL: ${SENTINELLAN_AGENT_LEGACY_AUTH_UNTIL:-}
      SENTINELLAN_REDIS_CONNECTION: ${SENTINELLAN_REDIS_CONNECTION:-}
      SENTINELLAN_REDIS_CHANNEL_PREFIX: ${SENTINELLAN_REDIS_CHANNEL_PREFIX:-}
      SENTINELLAN_ATTACHMENT_STORAGE: ${SENTINELLAN_ATTACHMENT_STORAGE:-Database}
      SENTINELLAN_ATTACHMENT_USER_DAILY_BYTES: ${SENTINELLAN_ATTACHMENT_USER_DAILY_BYTES:-20971520}
      SENTINELLAN_ATTACHMENT_ORGANIZATION_DAILY_BYTES: ${SENTINELLAN_ATTACHMENT_ORGANIZATION_DAILY_BYTES:-209715200}
      SENTINELLAN_ATTACHMENT_ORGANIZATION_TOTAL_BYTES: ${SENTINELLAN_ATTACHMENT_ORGANIZATION_TOTAL_BYTES:-2147483648}
      SENTINELLAN_INGRESS_REQUESTS_PER_MINUTE: ${SENTINELLAN_INGRESS_REQUESTS_PER_MINUTE:-600}
      SENTINELLAN_INGRESS_BURST: ${SENTINELLAN_INGRESS_BURST:-300}
      SENTINELLAN_INGRESS_CONCURRENCY: ${SENTINELLAN_INGRESS_CONCURRENCY:-128}
      SENTINELLAN_LEGACY_PASSWORD_HASHES_UNTIL: ${SENTINELLAN_LEGACY_PASSWORD_HASHES_UNTIL:-}
      SENTINELLAN_S3_ENDPOINT: ${SENTINELLAN_S3_ENDPOINT:-}
      SENTINELLAN_S3_REGION: ${SENTINELLAN_S3_REGION:-}
      SENTINELLAN_S3_BUCKET: ${SENTINELLAN_S3_BUCKET:-}
      SENTINELLAN_S3_ACCESS_KEY: ${SENTINELLAN_S3_ACCESS_KEY:-}
      SENTINELLAN_S3_SECRET_KEY: ${SENTINELLAN_S3_SECRET_KEY:-}
      SENTINELLAN_S3_FORCE_PATH_STYLE: ${SENTINELLAN_S3_FORCE_PATH_STYLE:-false}
      SENTINELLAN_BOOTSTRAP_WINDOWS_URL: ${SENTINELLAN_BOOTSTRAP_WINDOWS_URL:-}
      SENTINELLAN_BOOTSTRAP_WINDOWS_SHA256: ${SENTINELLAN_BOOTSTRAP_WINDOWS_SHA256:-}
      SENTINELLAN_BOOTSTRAP_WINDOWS_PUBLISHER: ${SENTINELLAN_BOOTSTRAP_WINDOWS_PUBLISHER:-}
      SENTINELLAN_BOOTSTRAP_LINUX_URL: ${SENTINELLAN_BOOTSTRAP_LINUX_URL:-}
      SENTINELLAN_BOOTSTRAP_LINUX_SHA256: ${SENTINELLAN_BOOTSTRAP_LINUX_SHA256:-}
    depends_on:
      postgres:
        condition: service_healthy

  company:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        WEB_APP: company
        NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on: [api]

  employee:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        WEB_APP: employee
        NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${SENTINELLAN_PROXY_IP:-172.30.20.10}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - company
      - employee

networks:
  default:
    ipam:
      config:
        - subnet: ${SENTINELLAN_PROXY_SUBNET:-172.30.20.0/24}

volumes:
  sentinellan-lan-postgres:

