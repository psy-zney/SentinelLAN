pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log off;
    client_max_body_size 16M;
    map $http_upgrade $sentinellan_connection { default upgrade; '' close; }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_protocols TLSv1.3;
        ssl_certificate /run/sentinellan-tls/gateway.crt;
        ssl_certificate_key /run/sentinellan-tls/gateway.key;
        ssl_session_tickets off;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /run/sentinellan-tls/ca.crt;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location /health/ { proxy_ssl_name api; proxy_pass https://api:8443; }
        location /api/ { proxy_ssl_name api; proxy_pass https://api:8443; }
        location /hubs/ {
            proxy_ssl_name api;
            proxy_pass https://api:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $sentinellan_connection;
            proxy_read_timeout 3600s;
        }
        location = / { return 302 /company/login; }
        location = /login { return 302 /company/login; }
        location = /activate { return 302 /employee/activate; }
        location /qr/ { return 302 /employee$request_uri; }
        location /company { proxy_ssl_name company; proxy_pass https://company:3443; }
        location /employee { proxy_ssl_name employee; proxy_pass https://employee:3443; }
        location / { return 404; }
    }
}
