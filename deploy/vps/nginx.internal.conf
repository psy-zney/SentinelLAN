# HTTP gateway accessible only through a host HTTPS reverse proxy on loopback.
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 16M;

    map $http_upgrade $sentinellan_connection {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location /health/ { proxy_pass http://api:8080; }
        location /api/ { proxy_pass http://api:8080; }
        location /hubs/ {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $sentinellan_connection;
            proxy_read_timeout 3600s;
        }

        location = / { return 302 /employee/login; }
        location = /login { return 302 /company/login; }
        location = /activate { return 302 /employee/activate; }
        location /qr/ { return 302 /employee$request_uri; }
        location /company { proxy_pass http://company:3000; }
        location /employee { proxy_pass http://employee:3000; }
        location /platform { proxy_pass http://platform:3000; }
        location / { return 404; }
    }
}
