# Include from nginx.conf outside http{}. HTTP :9000 must use explicit
# addresses and reserve 127.0.0.2:9000 for this loopback-only TLS relay.
# The relay passes TLS through; the existing HTTPS site still verifies
# the gateway certificate and applies its authorization/rate-limit rules.
stream {
    server {
        listen 127.0.0.2:9000;
        proxy_pass 127.0.0.1:9003;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}
