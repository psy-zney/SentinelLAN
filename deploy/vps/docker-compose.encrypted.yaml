# Add after prod and host-proxy compose files. Certificates are provisioned separately.
# Every connection across container interfaces uses verified TLS. Web plaintext stays on loopback.
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: "70:70"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,uid=70,gid=70,size=16m
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - ssl_cert_file=/run/sentinellan-tls/postgres.crt
      - -c
      - ssl_key_file=/run/sentinellan-tls/postgres.key
      - -c
      - ssl_ca_file=/run/sentinellan-tls/ca.crt
      - -c
      - hba_file=/etc/postgresql/sentinellan-pg_hba.conf
    volumes:
      - ${TLS_DIRECTORY:?Set TLS_DIRECTORY}/postgres:/run/sentinellan-tls:ro
      - ./pg_hba.encrypted.conf:/etc/postgresql/sentinellan-pg_hba.conf:ro

  api:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      DOTNET_EnableDiagnostics: "0"
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Logging__LogLevel__Microsoft.AspNetCore.Hosting.Diagnostics: Warning
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Endpoints__Https__Url: https://+:8443
      ASPNETCORE_Kestrel__Endpoints__Https__SslProtocols__0: Tls13
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/sentinellan-tls/api.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /run/sentinellan-tls/api.key
      ConnectionStrings__SentinelLAN: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sentinellan};Username=${POSTGRES_USER:-sentinellan};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};SSL Mode=VerifyFull;Root Certificate=/run/sentinellan-tls/ca.crt;SSL Certificate=/run/sentinellan-tls/db-client.crt;SSL Key=/run/sentinellan-tls/db-client.key;SSL Negotiation=direct;Channel Binding=Require
    volumes:
      - ${TLS_DIRECTORY:?Set TLS_DIRECTORY}/api:/run/sentinellan-tls:ro

  company:
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      HOSTNAME: 127.0.0.1
  employee:
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      HOSTNAME: 127.0.0.1

  company-tls:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    network_mode: service:company
    depends_on: [company]
    security_opt: [no-new-privileges:true]
    user: "101:101"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,uid=101,gid=101,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101,size=64m
    volumes:
      - ./nginx.web-tls.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_DIRECTORY:?Set TLS_DIRECTORY}/company:/run/sentinellan-tls:ro
  employee-tls:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    network_mode: service:employee
    depends_on: [employee]
    security_opt: [no-new-privileges:true]
    user: "101:101"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,uid=101,gid=101,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101,size=64m
    volumes:
      - ./nginx.web-tls.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_DIRECTORY:?Set TLS_DIRECTORY}/employee:/run/sentinellan-tls:ro

  nginx:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    user: "101:101"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,uid=101,gid=101,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101,size=64m
    ports: !override
      - "127.0.0.1:${HOST_PROXY_PORT:-9003}:8443"
    volumes: !override
      - ./nginx.encrypted.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_DIRECTORY:?Set TLS_DIRECTORY}/gateway:/run/sentinellan-tls:ro
    depends_on:
      - api
      - company-tls
      - employee-tls
