# Unix socket maintenance remains inside the container; remote access requires TLS,
# a CA-issued client certificate matching the database username, and SCRAM authentication.
local all all scram-sha-256
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl all all 0.0.0.0/0 scram-sha-256 clientcert=verify-full
hostssl all all ::/0 scram-sha-256 clientcert=verify-full
