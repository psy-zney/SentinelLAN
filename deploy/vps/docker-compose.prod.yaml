name: sentinellan-prod

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinellan}
      POSTGRES_USER: ${POSTGRES_USER:-sentinellan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sentinellan-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sentinellan-prod-redis:/data

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SentinelLAN: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sentinellan};Username=${POSTGRES_USER:-sentinellan};Password=${POSTGRES_PASSWORD}
      SENTINELLAN_DEMO_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sentinellan.local}
      SENTINELLAN_DEMO_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SENTINELLAN_ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN}
      SENTINELLAN_SIGNING_KEY: ${SIGNING_KEY}
      SENTINELLAN_ACCESS_TOKEN_SIGNING_KEY: ${ACCESS_TOKEN_SIGNING_KEY}
      SENTINELLAN_WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost,https://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sentinellan-certbot-www:/var/www/certbot:ro
      - sentinellan-certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - web

volumes:
  sentinellan-prod-postgres:
  sentinellan-prod-redis:
  sentinellan-certbot-www:
  sentinellan-certbot-conf:
