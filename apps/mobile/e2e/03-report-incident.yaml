appId: com.sentinellan.employee
---
# Flow 3: Báo cáo sự cố an ninh / kỹ thuật có idempotency
- launchApp

# Chuyển sang tab Sự cố
- tapOn: "Sự cố"
- assertVisible: "Lịch sử sự cố"

# Mở form báo cáo mới
- tapOn: "+ Báo sự cố mới"
- assertVisible: "Báo sự cố mới"

# Điền form
- tapOn:
    id: "incident-title-input"
- inputText: "Mất kết nối VPN công ty đột ngột"

- tapOn:
    id: "incident-desc-input"
- inputText: "Máy tính không phân giải được DNS nội bộ sau khi cắm cáp mạng LAN phòng họp."

- hideKeyboard

# Gửi báo cáo
- tapOn:
    id: "submit-incident-button"
- assertVisible: "Sự cố đã được ghi nhận thành công."
- tapOn: "OK"

# Kiểm tra sự cố được tạo và quay về danh sách
- assertVisible: "Mất kết nối VPN công ty đột ngột"
