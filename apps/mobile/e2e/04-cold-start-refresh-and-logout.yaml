appId: com.sentinellan.mobile
---
# Flow 4: Cold-start refresh session và Đăng xuất an toàn
- stopApp
- launchApp

# Kiểm tra app tự phục hồi session mà không cần đăng nhập lại
- assertVisible: "Tổng quan"

# Vào tab Tài khoản
- tapOn: "Tài khoản"
- assertVisible: "Thông tin tài khoản"
- assertVisible: "Phiên bản ứng dụng"

# Thực hiện đăng xuất
- tapOn: "Đăng xuất tài khoản"

# Kiểm tra quay lại màn hình Login và phiên đã bị hủy
- assertVisible: "Đăng nhập tài khoản nhân viên"
- assertVisible: "SentinelLAN Mobile"
