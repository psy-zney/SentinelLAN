appId: com.sentinellan.employee
---
# Flow 6: Từ chối camera và nhập mã thủ công
- launchApp:
    permissions:
      camera: deny

# Chuyển sang tab Quét QR
- tapOn: "Quét QR"

# Giả định trạng thái quyền camera bị từ chối
- assertVisible: "Yêu cầu quyền truy cập Camera"

# Nhập mã vẫn phải dùng được khi camera bị từ chối.
- tapOn: "Hoặc nhập mã thiết bị thủ công"
- assertVisible: "Nhập mã QR hoặc tiền tố (vd: QR-A1B2C3D4)"
- tapOn:
    id: "manual-code-input"
- inputText: ${MAESTRO_ASSIGNED_QR_CODE}
- hideKeyboard
- tapOn:
    id: "submit-manual-code-button"
- assertVisible: "Máy tính của tôi"
