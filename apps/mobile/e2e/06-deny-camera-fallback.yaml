appId: com.sentinellan.mobile
---
# Flow 6: Từ chối quyền truy cập camera và sử dụng phương án dự phòng an toàn (Fallback)
- launchApp

# Chuyển sang tab Quét QR
- tapOn: "Quét QR"

# Giả định trạng thái quyền camera bị từ chối
- assertVisible: "Yêu cầu quyền truy cập Camera"
- assertVisible: "SentinelLAN cần quyền truy cập camera để quét mã QR dán trên thân máy trạm."

# Thử nghiệm chọn ảnh từ thư viện (Safe UX disclosure không giả mạo decode thành công)
- tapOn: "Chọn ảnh QR từ thư viện"
- assertVisible: "Chọn ảnh QR"
- assertVisible: "Đồng ý"
- tapOn: "Đồng ý"

# Xác nhận modal nhập mã thủ công tự động mở ra
- assertVisible: "Nhập mã tem thiết bị"
- tapOn: "Đóng"

# Thử nghiệm mở trực tiếp nhập mã thủ công
- tapOn: "Hoặc nhập mã thiết bị thủ công"
- assertVisible: "Nhập mã tem thiết bị"
- tapOn:
    id: "manual-code-input"
- inputText: "QR-SENTINEL-DEMO-01"
- hideKeyboard
- tapOn:
    id: "submit-manual-code-button"
- assertVisible: "Thiết bị được phân công"
