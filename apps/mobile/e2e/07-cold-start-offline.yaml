# Flow 7: Khởi động lạnh khi mất mạng (Cold Start Offline) và bảo toàn phiên
# Ngắt kết nối mạng giả lập
- setAirplaneMode: enabled

- stopApp
- launchApp

# Không xóa refresh token và không hiển thị dữ liệu riêng khi chưa xác thực lại.
- assertVisible: "Không thể kết nối máy chủ"
- assertVisible: "Thử lại"

# Khôi phục lại mạng
- setAirplaneMode: disabled
- tapOn: "Thử lại"
- assertVisible: "Tổng quan"
