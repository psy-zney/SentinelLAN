name: CI
on:
  push:
  pull_request:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine
        env: { POSTGRES_DB: sentinellan_test, POSTGRES_USER: sentinellan, POSTGRES_PASSWORD: test-only-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinellan -d sentinellan_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: true
      ConnectionStrings__SentinelLAN: Host=localhost;Port=5432;Database=sentinellan_test;Username=sentinellan;Password=test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.400 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: npm }
      - run: dotnet restore SentinelLAN.slnx
      - run: dotnet format SentinelLAN.slnx --verify-no-changes --no-restore
      - run: dotnet build SentinelLAN.slnx -c Release --no-restore
      - run: dotnet test SentinelLAN.slnx -c Release --no-build --logger trx
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: test-results, path: "**/TestResults/**", if-no-files-found: ignore, retention-days: 7 }
