name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: sentinellan_test
          POSTGRES_USER: sentinellan
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinellan -d sentinellan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: true
      ConnectionStrings__SentinelLAN: Host=localhost;Port=5432;Database=sentinellan_test;Username=sentinellan;Password=test-only-password

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Restore Backend Dependencies
        run: dotnet restore SentinelLAN.slnx

      - name: Build Backend Solution
        run: dotnet build SentinelLAN.slnx -c Release --no-restore

      - name: Run Backend Tests
        run: dotnet test SentinelLAN.slnx -c Release --no-build --logger trx

      - name: Install Web Dependencies
        run: npm ci

      - name: Lint Web Code
        run: npm run lint

      - name: Typecheck Web Code
        run: npm run typecheck

      - name: Run Web Unit Tests
        run: npm test

      - name: Build Web Production
        run: npm run build

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore
          retention-days: 7
