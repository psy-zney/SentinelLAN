name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: sentinellan_test
          POSTGRES_USER: sentinellan
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinellan -d sentinellan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: true
      ConnectionStrings__SentinelLAN: Host=localhost;Port=5432;Database=sentinellan_test;Username=sentinellan;Password=test-only-password

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check public site and private portal boundaries
        run: |
          test -z "$(git ls-files apps/platform)"
          while IFS= read -r file; do
            case "$file" in
              docs/site/index.html|docs/site/site.css|docs/site/downloads.js) ;;
              *) echo "Unexpected public site file: $file"; exit 1 ;;
            esac
          done < <(git ls-files docs/site)
          for file in docs/site/index.html docs/site/site.css docs/site/downloads.js; do
            test -s "$file" && test ! -L "$file"
          done

      - name: Validate VPS Compose Configuration
        env:
          PUBLIC_DOMAIN: sentinel.example.test
          POSTGRES_PASSWORD: ci-only-password
          BOOTSTRAP_ORG_CODE: ci-org
          BOOTSTRAP_ORG_NAME: CI Organization
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password
          COMMAND_PRIVATE_KEY_PEM: ci-compose-validation-only
          COMMAND_KEY_ID: ci-compose-key
          ACCESS_TOKEN_SIGNING_KEY: ci-access-token-key-at-least-32-characters
          SERVER_VAULT_KEY: ci-server-vault-key-at-least-32-characters
          SENTINELLAN_DATA_ENCRYPTION_KEY: ci-compose-configuration-check-only
        run: docker compose -f deploy/vps/docker-compose.prod.yaml config --quiet

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Test Host Status Collector
        run: python3 -B -m unittest discover -s deploy/vps/tests -v

      - name: Restore Backend Dependencies
        run: dotnet restore SentinelLAN.slnx

      - name: Audit Backend Dependencies
        run: dotnet list SentinelLAN.slnx package --vulnerable --include-transitive

      - name: Build Backend Solution
        run: dotnet build SentinelLAN.slnx -c Release --no-restore

      - name: Run Backend Tests
        run: dotnet test SentinelLAN.slnx -c Release --no-build --logger trx

      - name: Install Web Dependencies
        run: npm ci

      - name: Audit Runtime and Tooling Dependencies with Security Backports
        run: npm run audit:dependencies:all

      - name: Lint Web Code
        run: npm run lint

      - name: Typecheck Web Code
        run: npm run typecheck

      - name: Run Web Tests with Coverage
        run: npm run test:coverage

      - name: Build Web Production
        run: npm run build

      - name: Lint Mobile Code
        run: npm run lint:mobile

      - name: Check Mobile SDK Compatibility
        run: npm run check:sdk --workspace=@sentinellan/mobile
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Typecheck Mobile Code
        run: npm run typecheck:mobile

      - name: Run Mobile Tests with Coverage
        run: npm run test:coverage --workspace=@sentinellan/mobile -- --runInBand

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run Browser E2E Tests
        run: npm run test:e2e
        env:
          ConnectionStrings__SentinelLAN: ""
          SENTINELLAN_E2E_API_COMMAND: dotnet ../backend/src/SentinelLAN.Api/bin/Release/net10.0/SentinelLAN.Api.dll

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            **/TestResults/**
            apps/company/playwright-report/**
            apps/company/test-results/**
          if-no-files-found: ignore
          retention-days: 7
