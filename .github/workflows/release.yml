name: Release SentinelLAN Agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-agent:
    name: Verify Agent
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release requires a vX.Y.Z tag." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Agent tests
        run: dotnet test apps/agent/tests/SentinelLAN.Agent.Tests/SentinelLAN.Agent.Tests.csproj -c Release

  build-windows:
    name: Build Windows MSI and EXE
    needs: verify-agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Agent packages
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v').Split('-')[0]
          ./deploy/agent/build-msi.ps1 -Version $version
      - name: Stage Windows files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release-windows | Out-Null
          Copy-Item dist/windows-x64/SentinelLAN.Agent.msi dist/release-windows/
          Copy-Item dist/windows-x64/SentinelLAN.Agent.exe dist/release-windows/
          Copy-Item deploy/agent/configure-windows-agent.ps1 dist/release-windows/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-agent
          path: dist/release-windows/
          if-no-files-found: error

  build-linux:
    name: Build Linux Agent
    needs: verify-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish Linux binary
        run: |
          dotnet publish apps/agent/src/SentinelLAN.Agent/SentinelLAN.Agent.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -o dist/linux-x64
      - name: Stage Linux files
        run: |
          mkdir -p dist/release-linux
          cp dist/linux-x64/SentinelLAN.Agent dist/release-linux/
          cp deploy/agent/install-linux-agent.sh dist/release-linux/
          cp deploy/agent/sentinellan-agent.service dist/release-linux/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-agent
          path: dist/release-linux/
          if-no-files-found: error

  publish:
    name: Publish Agent-only GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-agent
          path: release-assets/
      - uses: actions/download-artifact@v4
        with:
          name: linux-agent
          path: release-assets/
      - name: Verify asset allowlist and checksums
        working-directory: release-assets
        run: |
          expected=(
            SentinelLAN.Agent.msi
            SentinelLAN.Agent.exe
            configure-windows-agent.ps1
            SentinelLAN.Agent
            install-linux-agent.sh
            sentinellan-agent.service
          )
          for file in "${expected[@]}"; do test -s "$file"; done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          sha256sum "${expected[@]}" > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SentinelLAN Agent ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/SentinelLAN.Agent.msi
            release-assets/SentinelLAN.Agent.exe
            release-assets/configure-windows-agent.ps1
            release-assets/SentinelLAN.Agent
            release-assets/install-linux-agent.sh
            release-assets/sentinellan-agent.service
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            Agent only: no VPS credentials, database, certificate or deployment environment is bundled.
            Windows: install SentinelLAN.Agent.msi, then run configure-windows-agent.ps1 with your organization's HTTPS API URL. The script asks for a one-time enrollment token.
            SentinelLAN.Agent.exe is the secondary Windows option for IT.
            Linux: download SentinelLAN.Agent, install-linux-agent.sh and sentinellan-agent.service into one directory, then follow the Agent enrollment guide.
            Server source, Compose template and .env.production.example remain in the repository; each organization configures its own VPS.
            Guide: https://github.com/psy-zney/SentinelLAN/blob/main/docs/guides/agent-enrollment-guide.md
          generate_release_notes: true
