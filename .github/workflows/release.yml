name: Release SentinelLAN Setup

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-agent:
    name: Verify Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Agent tests
        run: dotnet test apps/agent/tests/SentinelLAN.Agent.Tests/SentinelLAN.Agent.Tests.csproj -c Release

  build-windows:
    name: Build and verify Windows Setup
    needs: verify-agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Windows Agent and setup tests
        shell: pwsh
        run: |
          dotnet test apps/agent/tests/SentinelLAN.Agent.Tests/SentinelLAN.Agent.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Windows Agent tests failed.' }
          foreach ($scenario in @('Connected', 'TokenUsed', 'TokenExpired', 'ConnectionFailed')) {
            'ci-one-use-fixture' | pwsh -NoProfile -File scripts/test-agent-setup.ps1 -Scenario $scenario
            if ($LASTEXITCODE -ne 0) { throw "Setup test failed: $scenario" }
          }
          foreach ($scenario in @('Connected', 'ConnectionFailed')) {
            pwsh -NoProfile -File scripts/test-agent-setup.ps1 -Scenario $scenario -ExistingIdentity -ExistingIdentityOnly
            if ($LASTEXITCODE -ne 0) { throw "Resume test failed: $scenario" }
          }
          pwsh -NoProfile -File scripts/test-agent-setup.ps1 -Scenario IdentityMissing -ExistingIdentityOnly
          if ($LASTEXITCODE -ne 0) { throw 'Missing identity test failed.' }
      - name: Build matched company Agent and Setup
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v').Split('-')[0] } else { '1.0.1' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected vX.Y.Z release tag.' }
          $company = Get-Content deploy/agent/company-release.json -Raw | ConvertFrom-Json
          ./deploy/agent/build-msi.ps1 -Version $version -CompanyServerUrl $company.serverUrl -CommandPublicKey $company.commandPublicKey -CommandKeyId $company.commandKeyId
          ./scripts/verify-agent-release.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/windows-x64/SentinelLAN.Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: setup-verification
          path: |
            dist/windows-x64/configuration-check.json
            dist/windows-x64/SHA256SUMS.txt
            dist/windows-x64/agent-release.json
          if-no-files-found: error

  publish:
    name: Publish Setup EXE only
    if: github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets/
      - name: Verify only the installer is published
        run: |
          test -s release-assets/SentinelLAN.Setup.exe
          test "$(find release-assets -type f | wc -l)" -eq 1
          python3 scripts/write-agent-release-notes.py release-assets/SentinelLAN.Setup.exe > release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SentinelLAN Setup ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/SentinelLAN.Setup.exe
          fail_on_unmatched_files: true
          body_path: release-notes.md
          make_latest: true
