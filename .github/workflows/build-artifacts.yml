name: Build Cross-Platform Agent Binaries

on:
  push:
    branches: ["main"]
    paths:
      - "apps/agent/**"
      - "deploy/agent/**"
      - ".github/workflows/build-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Agent (MSI and EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Windows Agent MSI and EXE
        run: ./deploy/agent/build-msi.ps1 -Version 0.1.0

      - name: Upload Windows Agent MSI (Primary Installer)
        uses: actions/upload-artifact@v4
        with:
          name: sentinellan-agent-windows-x64-msi
          path: dist/windows-x64/SentinelLAN.Agent.msi

      - name: Upload Windows Agent EXE (Portable Binary)
        uses: actions/upload-artifact@v4
        with:
          name: sentinellan-agent-windows-x64-exe
          path: dist/windows-x64/SentinelLAN.Agent.exe

      - name: Upload Windows Configuration Script
        uses: actions/upload-artifact@v4
        with:
          name: sentinellan-agent-windows-config
          path: deploy/agent/configure-windows-agent.ps1

  build-linux:
    name: Build Linux Agent (Daemon Binary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Linux x64 Binary
        run: |
          dotnet publish apps/agent/src/SentinelLAN.Agent/SentinelLAN.Agent.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o dist/linux-x64

      - name: Upload Linux Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinellan-agent-linux-x64
          path: dist/linux-x64/SentinelLAN.Agent
