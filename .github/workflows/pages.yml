name: Publish SentinelLAN Guide

on:
  push:
    branches: ["main"]
    paths:
      - "docs/site/**"
      - "docs/system-map.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir -p dist/site
          cp docs/site/index.html docs/site/site.css docs/site/downloads.js dist/site/
          cp docs/system-map.html dist/site/system-map.html
          test -s dist/site/index.html
          test -s dist/site/system-map.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
