name: Publish SentinelLAN Guide

on:
  push:
    branches: ["main"]
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check public site allowlist
        run: |
          while IFS= read -r file; do
            case "$file" in
              docs/site/index.html|docs/site/site.css|docs/site/downloads.js) ;;
              *) echo "Unexpected public site file: $file"; exit 1 ;;
            esac
          done < <(git ls-files docs/site)
      - name: Build static site
        run: |
          mkdir -p dist/site
          for file in docs/site/index.html docs/site/site.css docs/site/downloads.js; do
            test -s "$file" && test ! -L "$file"
          done
          cp docs/site/index.html docs/site/site.css docs/site/downloads.js dist/site/
          test -s dist/site/index.html
          test -s dist/site/site.css
          test -s dist/site/downloads.js
          test "$(find dist/site -type f | wc -l)" -eq 3
          test -z "$(find dist/site -type l -print -quit)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
