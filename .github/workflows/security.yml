name: Security
on:
  pull_request:
    branches: [main]
  schedule: [{ cron: "17 3 * * 1" }]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.400 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: npm }
      - run: dotnet restore SentinelLAN.slnx
      - run: dotnet list SentinelLAN.slnx package --vulnerable --include-transitive
      - run: npm ci
      - run: npm audit --audit-level=high
