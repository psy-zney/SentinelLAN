services:
  postgres:
    ports: !override ["127.0.0.1::5432"]
  api:
    ports: !override ["127.0.0.1:18082:8080"]
    environment:
      SENTINELLAN_WEB_ORIGINS: "http://127.0.0.1:13300,http://localhost:13300"
  web:
    ports: !override ["127.0.0.1:13300:3000"]
    build:
      args:
        NEXT_PUBLIC_API_URL: "http://127.0.0.1:18082"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:18082"
